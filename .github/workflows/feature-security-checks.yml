name: Feature security checks
on:
  push:
    branches:
      - feature-testbyganesh
  pull_request:
    branches:
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Lint edited PHP files
        run: |
          set -euo pipefail
          for file in \
            aaraa-tenant-routing.php \
            wp-config.php \
            wp-config-aaraa.php \
            paytm/initiateTransaction.php \
            paytm/response.php \
            ccavenue/Crypto.php \
            ccavenue/ccavRequestHandler.php \
            ccavenue/ccavResponseHandler.php \
            wp-content/plugins/ccavanue-woocommerce-payment-getway/index.php \
            wp-content/plugins/paytm-payments/class.paytm.php \
            wp-content/plugins/paytm-payments/woo-paytm.php \
            wp-content/plugins/aaraa-white-label-admin/includes/class-delivery-calendar-api.php \
            tests/security-contracts.php \
            tests/delivery-calendar-auth.php \
            tests/tenant-routing.php
          do
            php -l "$file"
          done
      - name: Lint Aaraa custom PHP modules
        run: |
          set -euo pipefail
          find \
            wp-content/plugins/aaraa-white-label-admin \
            wp-content/plugins/aaraa-vendor-hub \
            wp-content/plugins/aaraa-user-export \
            wp-content/plugins/milk-delivery-schedule \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file" >/dev/null || exit 1
            done
      - name: Check source security contracts
        run: |
          php tests/security-contracts.php
          php tests/delivery-calendar-auth.php
          php tests/tenant-routing.php
